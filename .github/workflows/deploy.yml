name: Deploy Expo Web to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build Expo Web
        run: npm run build

      - name: Deploy to Vercel
        run: npx vercel deploy --prod --name soothera-web --yes --token=${{ secrets.VERCEL_TOKEN }}
